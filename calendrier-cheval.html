<body><header class="top"><div class="wrap"><strong>DicoPets · DicoCheval</strong><a href="dicocheval.html">← Retour à DicoCheval</a></div></header>
<section class="hero"><div class="wrap"><h1>Mon calendrier équestre</h1><p>Garde tes séances, rendez-vous vétérinaires, maréchalerie, concours et soins importants au même endroit. Ce calendrier est privé et lié à ton compte.</p></div></section>
<main class="wrap calendar"><button id="enableNotifications" class="button alt" type="button">Activer les rappels sur cet appareil</button><p id="notificationStatus" class="status"></p><div class="calendar-grid"><section><h2>Ajouter un événement</h2><div class="form-grid"><label>Date<input id="calDate" type="date"></label><label>Heure<input id="calTime" type="time" required></label><label class="wide">Titre<input id="calTitle" maxlength="120" placeholder="Ex. Visite du maréchal pour Étoile"></label><label>Catégorie<select id="calType"><option>Rendez-vous vétérinaire</option><option>Maréchalerie</option><option>Vaccin</option><option>Vermifuge</option><option>Séance d’équitation</option><option>Concours</option><option>Soins</option><option>Autre</option></select></label><label>Rappel avant<select id="calReminder"><option value="0">À l’heure exacte</option><option value="15">15 minutes avant</option><option value="30">30 minutes avant</option><option value="45">45 minutes avant</option><option value="60" selected>1 heure avant</option><option value="120">2 heures avant</option><option value="1440">1 jour avant</option></select></label><label>Langue du rappel<select id="calReminderLanguage"><option value="fr">Français</option><option value="en">English</option></select></label><label class="wide">Notes<textarea id="calNotes" maxlength="1500" placeholder="Préparation, adresse, matériel à prévoir…"></textarea></label></div><button id="calSave" class="button">Ajouter au calendrier</button><p id="calStatus" class="status"></p></section><aside><h2>Mes prochains événements</h2><div id="calEvents" class="event-list"><p class="status">Connexion en cours…</p></div></aside></div></main>
