<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profil membre — DicoPets</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="mobile-fixes.css?v=20260813">
  <style>
    body{margin:0;background:#edf2ea;color:#24362e;font:16px Arial,sans-serif}.page{width:min(720px,calc(100% - 32px));margin:45px auto}.back{color:#234238;font-weight:bold;text-decoration:none}.card{margin-top:20px;background:#fffdf8;border:1px solid #d7e0d5;border-radius:16px;padding:30px;text-align:center}.avatar{width:120px;height:120px;object-fit:cover;border-radius:50%;background:#dfe9df;border:3px solid #b58a4b}.meta{color:#63756a}.points{display:inline-block;background:#fff1d7;color:#765215;border-radius:99px;padding:7px 12px;font-weight:bold}.badges,.favorites{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0}.badge,.favorite{background:#edf2ea;border-radius:99px;padding:7px 11px;font-size:13px;font-weight:bold}.favorite-title{margin:22px 0 8px;font:700 22px Georgia,serif;color:#234238}
  </style>
  <script src="theme.js?v=20260825-contrast3"></script>
</head>
<body>
  <main class="page"><a class="back" href="index.html" id="back">← Retour à DicoPets</a><section class="card" id="profile"><p class="meta">Chargement du profil…</p></section></main>
  <script>
  (()=>{
    const db=window.supabase.createClient('https://mmxdlnfntpufwwkdvgzc.supabase.co','sb_publishable_Pa-DX3nwNTZktbWK46KDQg_IuIy8TZP');
    const name=new URLSearchParams(location.search).get('pseudo'),box=document.getElementById('profile');
    const english=localStorage.getItem('dicochevalLocale')==='en-US';
    const labels={world:['🌍','Explorateur du monde','World explorer'],finder:['✨','Mon cheval idéal','My ideal horse'],breed:['🐴','Passionné de races','Breed enthusiast'],quiz:['🏆','Quiz terminé','Quiz complete']};
    const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const favoriteList=value=>value&&typeof value==='object'?[...new Set(Object.values(value).flat().filter(Boolean))]:[];
    document.documentElement.lang=english?'en':'fr';document.getElementById('back').textContent=english?'← Back to DicoPets':'← Retour à DicoPets';
    async function load(){
      if(!name){box.innerHTML='<p>Profil introuvable.</p>';return}
      const {data,error}=await db.from('profils_publics').select('*').ilike('pseudo',name).limit(1);const profile=data?.[0];
      if(error||!profile){box.innerHTML='<p>'+(english?'This profile cannot be found yet.':'Ce profil est introuvable ou n’est pas encore public.')+'</p>';return}
      const joined=new Intl.DateTimeFormat(english?'en-US':'fr-CA',{year:'numeric',month:'long',day:'numeric'}).format(new Date(profile.membre_depuis));
      const badges=Array.isArray(profile.badges)?profile.badges:[],favorites=favoriteList(profile.favorites);
      const badgesHtml=badges.map(key=>labels[key]?'<span class="badge">'+labels[key][0]+' '+labels[key][english?2:1]+'</span>':'').join('');
      const favoritesHtml=favorites.length?favorites.map(race=>'<span class="favorite">'+esc(race)+'</span>').join(''):'<span class="meta">'+(english?'No favourite breeds yet.':'Aucune race favorite pour le moment.')+'</span>';
      box.innerHTML='<img class="avatar" src="'+esc(profile.avatar_url||'assets/avatar-0.png')+'" alt=""><h1>'+esc(profile.pseudo)+'</h1><p class="points">'+Number(profile.points||0)+' '+(english?'points':'point'+(Number(profile.points||0)===1?'':'s'))+'</p><p class="meta">'+(english?'Member since ':'Membre depuis le ')+joined+'</p><div class="badges">'+badgesHtml+'</div><h2 class="favorite-title">'+(english?'Favourite breeds':'Races préférées')+'</h2><div class="favorites">'+favoritesHtml+'</div>';
    }
    load();
  })();
  </script>
  <script src="touch-fix.js?v=20260823-native"></script>
<script src="modern-ui.js?v=20260825-modern2"></script></body>
</html>
